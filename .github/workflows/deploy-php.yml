name: Deploy PHP to di.labanos.dk

on:
  push:
    branches: [main]
    paths:
      - 'php/**'
      - '.github/workflows/deploy-php.yml'

env:
  # labanos.dk is served from webroots/www on one.com. The SFTP user's home
  # (users/cib30a83y_ssh) is NOT served — uploads there never go live.
  LIVE_DIR: /customers/2/3/7/cib30a83y/webroots/www/di
  # Files deployed to LIVE_DIR. Deliberately only the player-accounts files for now:
  # the other endpoints (incl. db_connect.php, which gets DB credentials from secrets)
  # are still the hand-uploaded live copies, and the secrets have never been verified
  # against the live site. Add files here once that is checked.
  DEPLOY_FILES: auth.php db_migrate.php .htaccess

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject DB credentials
        run: |
          for f in $DEPLOY_FILES; do
            [ "${f##*.}" = "php" ] || continue
            sed -i "s|%%DB_HOST%%|${{ secrets.DB_HOST }}|g; s|%%DB_NAME%%|${{ secrets.DB_NAME }}|g; s|%%DB_USER%%|${{ secrets.DB_USER }}|g; s|%%DB_PASS%%|${{ secrets.DB_PASS }}|g" "php/$f"
          done

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Back up live files
        run: |
          # Copy the current live versions to the SSH user's home (outside the web root).
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          sshpass -p "${{ secrets.SFTP_PASS }}" ssh -o BatchMode=no \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
            -p ${{ secrets.SFTP_PORT }} "${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}" \
            "set -e; mkdir -p ~/di-backups/$STAMP; cd '$LIVE_DIR'; for f in $DEPLOY_FILES; do [ -e \"\$f\" ] && cp -p \"\$f\" ~/di-backups/$STAMP/ || true; done; ls -A ~/di-backups/$STAMP"
          echo "::notice title=Backup::~/di-backups/$STAMP"

      - name: Deploy via SFTP
        run: |
          # Batch mode (-b -): any failed command aborts with a non-zero exit and fails the step.
          # BatchMode=no keeps password auth working for sshpass.
          {
            echo "cd $LIVE_DIR"
            for f in $DEPLOY_FILES; do echo "put php/$f $f"; done
            echo "ls -l"
          } > batch.txt
          sshpass -p "${{ secrets.SFTP_PASS }}" sftp -o BatchMode=no -b batch.txt \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -P ${{ secrets.SFTP_PORT }} \
            "${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}" | tee sftp.log
          for f in $DEPLOY_FILES; do
            grep -E " $f\$" sftp.log | sed 's/  */ /g' | while IFS= read -r l; do echo "::notice title=Live di/::$l"; done
          done
