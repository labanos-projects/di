name: Deploy PHP to di.labanos.dk

on:
  push:
    branches: [main]
    paths:
      - 'php/**'
      - '.github/workflows/deploy-php.yml'

env:
  # labanos.dk is served from webroots/www on one.com. The SFTP user's home
  # (users/cib30a83y_ssh) is NOT served — uploads there never go live.
  LIVE_DIR: /customers/2/3/7/cib30a83y/webroots/www/di
  # Files deployed to LIVE_DIR: every endpoint except db_connect.php. db_connect.php holds
  # the real DB credentials and is managed by hand on the server; it is never uploaded.
  # (On 2026-10-24 all live files were verified byte-identical to the repo before this.)
  DEPLOY_FILES: >-
    auth_lib.php auth.php db_migrate.php admin.php players.php matches.php roster.php
    results.php leaderboard.php year_schedule.php player_stats.php pair_suggest.php
    pairing_analysis.php shop.php .htaccess

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Compare live files with repo (reported as annotations)
        run: |
          # db_connect.php is skipped: live has real credentials, the repo has placeholders.
          sshpass -p "${{ secrets.SFTP_PASS }}" ssh -o BatchMode=no \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
            -p ${{ secrets.SFTP_PORT }} "${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}" \
            "cd '$LIVE_DIR' && sha256sum *.php .htaccess" > live.sha
          SAME=""; DIFF=""; ONLY_LIVE=""; ONLY_REPO=""
          for f in php/*.php php/.htaccess; do
            b=$(basename "$f"); [ "$b" = "db_connect.php" ] && continue
            live=$(awk -v n="$b" '$2==n {print $1}' live.sha)
            repo=$(sha256sum "$f" | cut -d' ' -f1)
            if [ -z "$live" ]; then ONLY_REPO="$ONLY_REPO $b"
            elif [ "$live" = "$repo" ]; then SAME="$SAME $b"
            else DIFF="$DIFF $b"; fi
          done
          for b in $(awk '{print $2}' live.sha); do
            [ -e "php/$b" ] || ONLY_LIVE="$ONLY_LIVE $b"
          done
          echo "::notice title=Live = repo::${SAME:- none}"
          echo "::notice title=Live differs from repo::${DIFF:- none}"
          echo "::notice title=Only in repo (not live)::${ONLY_REPO:- none}"
          echo "::notice title=Only live (not in repo)::${ONLY_LIVE:- none}"

      - name: Back up live files
        run: |
          # Copy the current live versions to the SSH user's home (outside the web root).
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          sshpass -p "${{ secrets.SFTP_PASS }}" ssh -o BatchMode=no \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
            -p ${{ secrets.SFTP_PORT }} "${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}" \
            "set -e; mkdir -p ~/di-backups/$STAMP; cd '$LIVE_DIR'; for f in $DEPLOY_FILES; do [ -e \"\$f\" ] && cp -p \"\$f\" ~/di-backups/$STAMP/ || true; done; ls -A ~/di-backups/$STAMP"
          echo "::notice title=Backup::~/di-backups/$STAMP"

      - name: Deploy via SFTP
        run: |
          # Batch mode (-b -): any failed command aborts with a non-zero exit and fails the step.
          # BatchMode=no keeps password auth working for sshpass.
          {
            echo "cd $LIVE_DIR"
            for f in $DEPLOY_FILES; do echo "put php/$f $f"; done
            echo "ls -l"
          } > batch.txt
          sshpass -p "${{ secrets.SFTP_PASS }}" sftp -o BatchMode=no -b batch.txt \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -P ${{ secrets.SFTP_PORT }} \
            "${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}" | tee sftp.log
          for f in $DEPLOY_FILES; do
            grep -E " $f\$" sftp.log | sed 's/  */ /g' | while IFS= read -r l; do echo "::notice title=Live di/::$l"; done
          done
